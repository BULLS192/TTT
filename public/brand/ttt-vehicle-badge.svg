<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" aria-labelledby="title desc">
  <title id="title">TTT vehicle badge</title>
  <desc id="desc">Web derivative of the approved TTT inverted-triangle vehicle badge with chrome lettering, black center and deep-blue illuminated inner border.</desc>
  <defs>
    <linearGradient id="chrome" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".17" stop-color="#A8B0BB"/>
      <stop offset=".35" stop-color="#F7F9FC"/>
      <stop offset=".56" stop-color="#6F7884"/>
      <stop offset=".78" stop-color="#DDE2E8"/>
      <stop offset="1" stop-color="#8A939F"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#F4F7FA"/>
      <stop offset=".48" stop-color="#747D88"/>
      <stop offset="1" stop-color="#E1E6EB"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#012374"/>
      <stop offset=".55" stop-color="#2B5FD9"/>
      <stop offset="1" stop-color="#5B89FF"/>
    </linearGradient>
    <radialGradient id="face" cx="50%" cy="36%" r="72%">
      <stop offset="0" stop-color="#1B2028"/>
      <stop offset=".55" stop-color="#090B0F"/>
      <stop offset="1" stop-color="#020304"/>
    </radialGradient>
    <filter id="blueGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <path d="M80 92H640L360 572Z" fill="url(#steel)"/>
    <path d="M105 116H615L360 544Z" fill="#0B0D11"/>
    <path d="M128 138H592L360 510Z" fill="none" stroke="url(#blue)" stroke-width="14" filter="url(#blueGlow)"/>
    <path d="M143 151H577L360 493Z" fill="url(#face)" stroke="#202731" stroke-width="2"/>
    <path d="M174 205H546" stroke="#343C47" stroke-width="3" opacity=".65"/>
    <path d="M205 242H515" stroke="#151A21" stroke-width="2"/>
    <g fill="url(#chrome)" stroke="#333A44" stroke-width="3" stroke-linejoin="round">
      <path d="M195 235H314V274H274V412H235V274H195Z"/>
      <path d="M302 235H421V274H381V412H342V274H302Z"/>
      <path d="M409 235H528V274H488V412H449V274H409Z"/>
    </g>
    <path d="M220 430H500" stroke="#AAB2BC" stroke-width="2" opacity=".4"/>
  </g>
</svg>
