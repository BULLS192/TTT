<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TTT Concept One cinematic fallback</title>
  <desc id="desc">Dark studio illustration of the matte-black Concept One coupe for use when cinematic media is unavailable.</desc>
